name: Update registry

on:
  push:
    branches: [main]
    # registry/skills.json is deliberately not listed, so the bot's commit can't retrigger this.
    paths:
      - "skills/**"
      - "registry/schema.json"
      - "registry/categories.json"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: registry
  cancel-in-progress: false

jobs:
  registry:
    runs-on: ubuntu-latest
    env:
      DISPATCH_TOKEN: ${{ secrets.SKILLS_WEB_DISPATCH_TOKEN }}
      DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for createdAt / updatedAt

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Validate and generate registry
        run: npm run registry

      - name: Commit registry if changed
        id: commit
        run: |
          if git diff --quiet -- registry/skills.json && ! git ls-files --others --exclude-standard | grep -qx registry/skills.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry/skills.json
          git commit -m "chore(registry): regenerate skills.json [skip ci]"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Always notify, not only when skills.json changed: an edit to a SKILL.md body changes its page
      # even when the registry file doesn't. skills-web builds from agent-skills/main.
      - name: Notify skills-web to rebuild
        if: env.DISPATCH_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.DISPATCH_TOKEN }}
        run: gh api repos/velonx/skills-web/dispatches -f event_type=registry-updated -f "client_payload[sha]=$(git rev-parse HEAD)"

      # Redeploy the site on Vercel; its build pulls agent-skills/main. A failed build keeps the old site live.
      - name: Redeploy website
        if: env.DEPLOY_HOOK != ''
        run: curl -fsS -X POST "$DEPLOY_HOOK" -o /dev/null

      - name: Summary
        run: |
          if [ -n "$DEPLOY_HOOK" ]; then echo "Vercel deploy hook called." >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -z "$DISPATCH_TOKEN" ] && [ -z "$DEPLOY_HOOK" ]; then
            echo "No VERCEL_DEPLOY_HOOK_URL or SKILLS_WEB_DISPATCH_TOKEN secret — skills-web will pick this up on its hourly check." >> "$GITHUB_STEP_SUMMARY"
          fi
